services:
  - type: web
    name: sector-points
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: sector-points-db
          property: connectionString

databases:
  - name: sector-points-db
    plan: free
